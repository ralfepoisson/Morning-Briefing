name: morning-briefing

x-backend-common: &backend-common
  image: ${BACKEND_IMAGE:?BACKEND_IMAGE must be an immutable digest reference}
  init: true
  restart: unless-stopped
  networks:
    - app
    - postgresql
    - egress
  security_opt:
    - no-new-privileges:true
  user: "10001:10001"
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  pids_limit: 256
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"
  volumes:
    - ${APP_ROOT:-/srv/apps/morning-briefing}/data/audio:/var/lib/morning-briefing/audio

services:
  frontend:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE must be an immutable digest reference}
    init: true
    restart: unless-stopped
    ports:
      - 127.0.0.1:${FRONTEND_LOOPBACK_PORT:-18080}:8080
    networks:
      - app
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,size=16m
      - /var/run:rw,noexec,nosuid,size=4m
      - /tmp:rw,noexec,nosuid,size=16m
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.50
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  backend:
    <<: *backend-common
    command: ["npm", "run", "start:prod"]
    env_file:
      - ${APP_ROOT:-/srv/apps/morning-briefing}/shared/config/backend.env
      - ${APP_ROOT:-/srv/apps/morning-briefing}/secrets/backend.env
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      AWS_REGION: eu-west-1
      AUDIO_BRIEFING_STORAGE_DIR: /var/lib/morning-briefing/audio
      LOCAL_SCHEDULER_ENABLED: "false"
      LOCAL_SNAPSHOT_WORKER_ENABLED: "false"
    ports:
      - 127.0.0.1:${BACKEND_LOOPBACK_PORT:-13000}:3000
    mem_limit: 1g
    cpus: 1.00
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 20s

  worker:
    <<: *backend-common
    command: ["npm", "run", "snapshot:worker:prod"]
    env_file:
      - ${APP_ROOT:-/srv/apps/morning-briefing}/shared/config/worker.env
      - ${APP_ROOT:-/srv/apps/morning-briefing}/secrets/worker.env
    environment:
      AWS_REGION: eu-west-1
      AUDIO_BRIEFING_STORAGE_DIR: /var/lib/morning-briefing/audio
    mem_limit: 2g
    cpus: 2.00
    stop_grace_period: 90s
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('fs');const ok=fs.readdirSync('/proc').filter(x=>/^\\d+$/.test(x)).some(x=>{try{return fs.readFileSync('/proc/'+x+'/cmdline','utf8').includes('run-snapshot-worker')}catch{return false}});if(!ok)process.exit(1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  migrate:
    <<: *backend-common
    profiles: ["ops"]
    restart: "no"
    command: ["npm", "run", "db:deploy"]
    env_file:
      - ${APP_ROOT:-/srv/apps/morning-briefing}/shared/config/backend.env
      - ${APP_ROOT:-/srv/apps/morning-briefing}/secrets/backend.env
    environment:
      AWS_REGION: eu-west-1
      AUDIO_BRIEFING_STORAGE_DIR: /var/lib/morning-briefing/audio
    mem_limit: 1g
    cpus: 1.00

  snapshot-refresh:
    <<: *backend-common
    profiles: ["schedules"]
    restart: "no"
    command: ["npm", "run", "snapshot:refresh:nightly:prod"]
    env_file:
      - ${APP_ROOT:-/srv/apps/morning-briefing}/shared/config/worker.env
      - ${APP_ROOT:-/srv/apps/morning-briefing}/secrets/worker.env
    environment:
      AWS_REGION: eu-west-1
      AUDIO_BRIEFING_STORAGE_DIR: /var/lib/morning-briefing/audio

  dashboard-audio-refresh:
    <<: *backend-common
    profiles: ["schedules"]
    restart: "no"
    command: ["npm", "run", "dashboard-briefing:refresh:scheduled:prod"]
    env_file:
      - ${APP_ROOT:-/srv/apps/morning-briefing}/shared/config/worker.env
      - ${APP_ROOT:-/srv/apps/morning-briefing}/secrets/worker.env
    environment:
      AWS_REGION: eu-west-1
      AUDIO_BRIEFING_STORAGE_DIR: /var/lib/morning-briefing/audio

networks:
  app:
    internal: true
  egress: {}
  postgresql:
    external: true
    name: personal-projects-postgresql
