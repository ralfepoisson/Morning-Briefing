name: morning-briefing

x-backend-common: &backend-common
  image: ${BACKEND_IMAGE:?BACKEND_IMAGE must be an immutable digest reference}
  init: true
  restart: unless-stopped
  networks:
    - app
    - postgresql
    - egress
  security_opt:
    - no-new-privileges:true
  user: "10001:10001"
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  pids_limit: 256
  logging:
    driver: awslogs
    options:
      awslogs-region: ${AWSLOGS_REGION:-eu-west-1}
      awslogs-group: ${BACKEND_AWSLOGS_GROUP:?BACKEND_AWSLOGS_GROUP is required}
      awslogs-stream-prefix: backend
      awslogs-create-group: "false"
  volumes:
    - ${APP_ROOT:-/srv/apps/morning-briefing}/data/audio:/var/lib/morning-briefing/audio

services:
  rabbitmq:
    image: rabbitmq:4.1-alpine@sha256:d2baf254132a017d54f1bf546dbf827190f4063644065307d8fe7f9532106919
    platform: linux/arm64
    hostname: morning-briefing-rabbitmq
    user: "100:101"
    init: true
    restart: unless-stopped
    networks:
      - app
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.00
    env_file:
      - ${APP_ROOT:-/srv/apps/morning-briefing}/secrets/rabbitmq.env
    environment:
      RABBITMQ_NODENAME: rabbit@morning-briefing-rabbitmq
    volumes:
      - ${APP_ROOT:-/srv/apps/morning-briefing}/data/rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWSLOGS_REGION:-eu-west-1}
        awslogs-group: ${RABBITMQ_AWSLOGS_GROUP:?RABBITMQ_AWSLOGS_GROUP is required}
        awslogs-stream-prefix: rabbitmq
        awslogs-create-group: "false"

  frontend:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE must be an immutable digest reference}
    init: true
    restart: unless-stopped
    ports:
      - 127.0.0.1:${FRONTEND_LOOPBACK_PORT:-18080}:8080
    networks:
      - app
      - host-port
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,size=16m
      - /var/run:rw,noexec,nosuid,size=4m
      - /tmp:rw,noexec,nosuid,size=16m
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.50
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWSLOGS_REGION:-eu-west-1}
        awslogs-group: ${FRONTEND_AWSLOGS_GROUP:?FRONTEND_AWSLOGS_GROUP is required}
        awslogs-stream-prefix: frontend
        awslogs-create-group: "false"

  backend:
    <<: *backend-common
    command: ["npm", "run", "start:prod"]
    depends_on:
      rabbitmq:
        condition: service_healthy
    env_file:
      - ${APP_ROOT:-/srv/apps/morning-briefing}/shared/config/backend.env
      - ${APP_ROOT:-/srv/apps/morning-briefing}/secrets/backend.env
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      AWS_REGION: eu-west-1
      AUDIO_BRIEFING_STORAGE_DIR: /var/lib/morning-briefing/audio
      LOCAL_SCHEDULER_ENABLED: "false"
      LOCAL_SNAPSHOT_WORKER_ENABLED: "false"
    ports:
      - 127.0.0.1:${BACKEND_LOOPBACK_PORT:-13000}:3000
    mem_limit: 1g
    cpus: 1.00
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 20s

  worker:
    <<: *backend-common
    command: ["npm", "run", "snapshot:worker:prod"]
    depends_on:
      rabbitmq:
        condition: service_healthy
    env_file:
      - ${APP_ROOT:-/srv/apps/morning-briefing}/shared/config/worker.env
      - ${APP_ROOT:-/srv/apps/morning-briefing}/secrets/worker.env
    environment:
      AWS_REGION: eu-west-1
      AUDIO_BRIEFING_STORAGE_DIR: /var/lib/morning-briefing/audio
      MESSAGE_BROKER_WORKER_HEALTH_FILE: /tmp/morning-briefing-worker-ready
    mem_limit: 2g
    cpus: 2.00
    stop_grace_period: 90s
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWSLOGS_REGION:-eu-west-1}
        awslogs-group: ${WORKER_AWSLOGS_GROUP:?WORKER_AWSLOGS_GROUP is required}
        awslogs-stream-prefix: worker
        awslogs-create-group: "false"
    healthcheck:
      test: ["CMD", "node", "-e", "if(!require('node:fs').existsSync('/tmp/morning-briefing-worker-ready'))process.exit(1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  migrate:
    <<: *backend-common
    profiles: ["ops"]
    restart: "no"
    command: ["npm", "run", "db:deploy"]
    env_file:
      - ${APP_ROOT:-/srv/apps/morning-briefing}/shared/config/backend.env
      - ${APP_ROOT:-/srv/apps/morning-briefing}/secrets/backend.env
    environment:
      AWS_REGION: eu-west-1
      AUDIO_BRIEFING_STORAGE_DIR: /var/lib/morning-briefing/audio
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWSLOGS_REGION:-eu-west-1}
        awslogs-group: ${BACKEND_AWSLOGS_GROUP:?BACKEND_AWSLOGS_GROUP is required}
        awslogs-stream-prefix: migrate
        awslogs-create-group: "false"
    mem_limit: 1g
    cpus: 1.00

  snapshot-refresh:
    <<: *backend-common
    profiles: ["schedules"]
    restart: "no"
    command: ["npm", "run", "snapshot:refresh:nightly:prod"]
    depends_on:
      rabbitmq:
        condition: service_healthy
    env_file:
      - ${APP_ROOT:-/srv/apps/morning-briefing}/shared/config/worker.env
      - ${APP_ROOT:-/srv/apps/morning-briefing}/secrets/worker.env
    environment:
      AWS_REGION: eu-west-1
      AUDIO_BRIEFING_STORAGE_DIR: /var/lib/morning-briefing/audio
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWSLOGS_REGION:-eu-west-1}
        awslogs-group: ${WORKER_AWSLOGS_GROUP:?WORKER_AWSLOGS_GROUP is required}
        awslogs-stream-prefix: snapshot-refresh
        awslogs-create-group: "false"

  dashboard-audio-refresh:
    <<: *backend-common
    profiles: ["schedules"]
    restart: "no"
    command: ["npm", "run", "dashboard-briefing:refresh:scheduled:prod"]
    depends_on:
      rabbitmq:
        condition: service_healthy
    env_file:
      - ${APP_ROOT:-/srv/apps/morning-briefing}/shared/config/worker.env
      - ${APP_ROOT:-/srv/apps/morning-briefing}/secrets/worker.env
    environment:
      AWS_REGION: eu-west-1
      AUDIO_BRIEFING_STORAGE_DIR: /var/lib/morning-briefing/audio
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWSLOGS_REGION:-eu-west-1}
        awslogs-group: ${WORKER_AWSLOGS_GROUP:?WORKER_AWSLOGS_GROUP is required}
        awslogs-stream-prefix: dashboard-audio-refresh
        awslogs-create-group: "false"

networks:
  app:
    internal: true
  host-port: {}
  egress: {}
  postgresql:
    external: true
    name: personal-projects-postgresql
