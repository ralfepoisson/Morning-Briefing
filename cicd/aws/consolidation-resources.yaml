AWSTemplateFormatVersion: '2010-09-09'
Description: Retained Morning Briefing managed resources for the consolidated EC2 host

Parameters:
  HostRoleName:
    Type: String
    Default: personal-projects-consolidation-host
  ExistingLogGroupName:
    Type: String
    Default: /personal-projects/morning-briefing

Resources:
  BackendRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: morning-briefing-prod-backend
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules":[{"rulePriority":1,"description":"Retain the newest 12 release images","selection":{"tagStatus":"tagged","tagPrefixList":["git-"],"countType":"imageCountMoreThan","countNumber":12},"action":{"type":"expire"}}]}

  FrontendRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: morning-briefing-prod-frontend
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules":[{"rulePriority":1,"description":"Retain the newest 12 release images","selection":{"tagStatus":"tagged","tagPrefixList":["git-"],"countType":"imageCountMoreThan","countNumber":12},"action":{"type":"expire"}}]}

  HostApplicationPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: morning-briefing-consolidated-host
      Roles:
        - !Ref HostRoleName
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: PullReleaseImages
            Effect: Allow
            Action:
              - ecr:GetAuthorizationToken
            Resource: '*'
          - Sid: ReadReleaseLayers
            Effect: Allow
            Action:
              - ecr:BatchCheckLayerAvailability
              - ecr:BatchGetImage
              - ecr:GetDownloadUrlForLayer
            Resource:
              - !GetAtt BackendRepository.Arn
              - !GetAtt FrontendRepository.Arn
          - Sid: WriteApplicationLogs
            Effect: Allow
            Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource:
              - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${ExistingLogGroupName}:*
          - Sid: SynthesizeBriefingAudio
            Effect: Allow
            Action:
              - polly:SynthesizeSpeech
            Resource: '*'

Outputs:
  ExistingLogGroupName:
    Value: !Ref ExistingLogGroupName
