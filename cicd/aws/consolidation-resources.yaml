AWSTemplateFormatVersion: '2010-09-09'
Description: Retained Morning Briefing managed resources for the consolidated EC2 host

Parameters:
  HostRoleName:
    Type: String
    Default: personal-projects-consolidation-host
  DatabaseSecretArn:
    Type: String
  GoogleClientSecretArn:
    Type: String
  GoogleStateSecretArn:
    Type: String

Resources:
  BackendRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: morning-briefing-prod-backend
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules":[{"rulePriority":1,"description":"Retain the newest 12 release images","selection":{"tagStatus":"tagged","tagPrefixList":["git-"],"countType":"imageCountMoreThan","countNumber":12},"action":{"type":"expire"}}]}

  FrontendRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: morning-briefing-prod-frontend
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules":[{"rulePriority":1,"description":"Retain the newest 12 release images","selection":{"tagStatus":"tagged","tagPrefixList":["git-"],"countType":"imageCountMoreThan","countNumber":12},"action":{"type":"expire"}}]}

  SnapshotDeadLetterQueue:
    Type: AWS::SQS::Queue
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      QueueName: morning-briefing-prod-snapshot-jobs-dlq
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  SnapshotQueue:
    Type: AWS::SQS::Queue
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      QueueName: morning-briefing-prod-snapshot-jobs
      MessageRetentionPeriod: 345600
      ReceiveMessageWaitTimeSeconds: 10
      VisibilityTimeout: 120
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt SnapshotDeadLetterQueue.Arn
        maxReceiveCount: 5

  HostApplicationPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: morning-briefing-consolidated-host
      Roles:
        - !Ref HostRoleName
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: PullReleaseImages
            Effect: Allow
            Action:
              - ecr:GetAuthorizationToken
            Resource: '*'
          - Sid: ReadReleaseLayers
            Effect: Allow
            Action:
              - ecr:BatchCheckLayerAvailability
              - ecr:BatchGetImage
              - ecr:GetDownloadUrlForLayer
            Resource:
              - !GetAtt BackendRepository.Arn
              - !GetAtt FrontendRepository.Arn
          - Sid: ProcessSnapshotQueue
            Effect: Allow
            Action:
              - sqs:SendMessage
              - sqs:ReceiveMessage
              - sqs:DeleteMessage
              - sqs:ChangeMessageVisibility
              - sqs:GetQueueAttributes
              - sqs:GetQueueUrl
            Resource: !GetAtt SnapshotQueue.Arn
          - Sid: InspectDeadLetterQueue
            Effect: Allow
            Action:
              - sqs:GetQueueAttributes
              - sqs:GetQueueUrl
            Resource: !GetAtt SnapshotDeadLetterQueue.Arn
          - Sid: ReadApplicationSecrets
            Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
            Resource:
              - !Ref DatabaseSecretArn
              - !Ref GoogleClientSecretArn
              - !Ref GoogleStateSecretArn
          - Sid: SynthesizeBriefingAudio
            Effect: Allow
            Action:
              - polly:SynthesizeSpeech
            Resource: '*'

Outputs:
  SnapshotQueueUrl:
    Value: !Ref SnapshotQueue
  SnapshotDeadLetterQueueUrl:
    Value: !Ref SnapshotDeadLetterQueue
