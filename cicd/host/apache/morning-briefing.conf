<VirtualHost *:8080>
    ServerName briefing.ralfepoisson.com

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"

    ProxyPass        /api/ http://127.0.0.1:13000/api/ retry=0 timeout=120
    ProxyPassReverse /api/ http://127.0.0.1:13000/api/

    ProxyPass        / http://127.0.0.1:18080/ retry=0 timeout=30
    ProxyPassReverse / http://127.0.0.1:18080/

    ErrorLog ${APACHE_LOG_DIR}/morning-briefing-error.log
    CustomLog ${APACHE_LOG_DIR}/morning-briefing-access.log combined
</VirtualHost>
